<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- Upper text arc for: ★ YAYASAN RUMAH PENDIDIKAN ISLAM ★ -->
    <path id="upperTextArc" d="M 72,300 A 228,228 0 1,1 528,300" fill="none" />
    
    <!-- Lower text arc for Arabic calligraphy -->
    <path id="lowerTextArc" d="M 522,316 A 224,224 0 0,1 78,316" fill="none" />

    <style>
      .latin-text {
        font-family: 'Plus Jakarta Sans', 'Arial Black', Arial, sans-serif;
        font-size: 27px;
        font-weight: 900;
        letter-spacing: 2.2px;
        fill: #007336;
      }
      .arabic-text {
        font-family: 'Amiri', 'Traditional Arabic', 'Scheherazade New', 'Noto Naskh Arabic', serif;
        font-size: 42px;
        font-weight: bold;
        fill: #007336;
      }
    </style>
  </defs>

  <!-- Background White Disc -->
  <circle cx="300" cy="300" r="294" fill="#ffffff" />

  <!-- Outer Double Green Border -->
  <circle cx="300" cy="300" r="288" fill="none" stroke="#007336" stroke-width="8.5" />
  <circle cx="300" cy="300" r="275" fill="none" stroke="#007336" stroke-width="2" />

  <!-- Upper Text: ★ YAYASAN RUMAH PENDIDIKAN ISLAM ★ -->
  <text class="latin-text">
    <textPath href="#upperTextArc" startOffset="50%" text-anchor="middle">
      ★ YAYASAN RUMAH PENDIDIKAN ISLAM ★
    </textPath>
  </text>

  <!-- Lower Calligraphy Text: دار التربية الإسلامية -->
  <text class="arabic-text">
    <textPath href="#lowerTextArc" startOffset="50%" text-anchor="middle">
      دَارُ التَّرْبِيَةِ الإِسْلَامِيَّةِ
    </textPath>
  </text>

  <!-- Inner Border Ring Framing the Star -->
  <circle cx="300" cy="305" r="186" fill="none" stroke="#007336" stroke-width="3" />

  <!-- Solid Islamic Green 5-Pointed Star -->
  <polygon points="
    300,97
    350,236.2
    497.8,240.7
    380.8,331.3
    422.3,473.3
    300,390
    177.7,473.3
    219.2,331.3
    102.2,240.7
    250,236.2
  " fill="#007336" stroke="#007336" stroke-width="3" stroke-linejoin="round" />

  <!-- Center White Medallion Disc -->
  <circle cx="300" cy="305" r="102" fill="#ffffff" stroke="#007336" stroke-width="5.5" />

  <!-- Sun Rays Radiating from behind the Dome (13 Sharp Rays) -->
  <g stroke="#007336" stroke-width="3.5" stroke-linecap="round">
    <!-- Center top ray -->
    <line x1="300" y1="236" x2="300" y2="214" />
    
    <!-- Left side rays -->
    <line x1="288" y1="239" x2="279" y2="218" />
    <line x1="277" y1="244" x2="259" y2="226" />
    <line x1="267" y1="251" x2="243" y2="237" />
    <line x1="260" y1="260" x2="231" y2="251" />
    <line x1="255" y1="271" x2="223" y2="268" />
    <line x1="253" y1="283" x2="219" y2="286" />

    <!-- Right side rays -->
    <line x1="312" y1="239" x2="321" y2="218" />
    <line x1="323" y1="244" x2="341" y2="226" />
    <line x1="333" y1="251" x2="357" y2="237" />
    <line x1="340" y1="260" x2="369" y2="251" />
    <line x1="345" y1="271" x2="377" y2="268" />
    <line x1="347" y1="283" x2="381" y2="286" />
  </g>

  <!-- Mosque Dome (Kubah) with Finial Spire -->
  <path d="M 276,295 C 276,256 292,238 300,233 C 308,238 324,256 324,295 Z" fill="#007336" />
  <!-- Spire & Crescent Top -->
  <line x1="300" y1="233" x2="300" y2="222" stroke="#007336" stroke-width="3" stroke-linecap="round" />
  <circle cx="300" cy="222" r="3.5" fill="#007336" />
  <path d="M 297,220 C 298,217 302,217 303,220 C 302,218 298,218 297,220 Z" fill="#007336" />

  <!-- Flanking Twin Pillars (Pilar Gerbang Ilmu) -->
  <rect x="256" y="286" width="16" height="54" rx="2" fill="#007336" />
  <rect x="328" y="286" width="16" height="54" rx="2" fill="#007336" />
  <rect x="254" y="283" width="20" height="5" rx="1.5" fill="#007336" />
  <rect x="326" y="283" width="20" height="5" rx="1.5" fill="#007336" />

  <!-- Archway Portal underneath Dome -->
  <path d="M 274,340 L 274,298 C 274,284 326,284 326,298 L 326,340 Z" fill="none" stroke="#007336" stroke-width="3.5" />

  <!-- Open Holy Quran (Kitab Suci Al-Qur'an Terbuka) -->
  <!-- Left Page -->
  <path d="M 300,344 C 290,336 266,335 252,343 C 250,358 284,360 300,354 Z" fill="#ffffff" stroke="#007336" stroke-width="3.8" stroke-linejoin="round" />
  <!-- Right Page -->
  <path d="M 300,344 C 310,336 334,335 348,343 C 350,358 316,360 300,354 Z" fill="#ffffff" stroke="#007336" stroke-width="3.8" stroke-linejoin="round" />
  
  <!-- Quran Center Fold Line -->
  <line x1="300" y1="344" x2="300" y2="354" stroke="#007336" stroke-width="2.5" />

  <!-- Quran Scripture Line Markings -->
  <path d="M 262,346 Q 280,343 293,348" stroke="#007336" stroke-width="1.8" fill="none" stroke-linecap="round" />
  <path d="M 264,351 Q 280,348 292,352" stroke="#007336" stroke-width="1.5" fill="none" stroke-linecap="round" />
  <path d="M 338,346 Q 320,343 307,348" stroke="#007336" stroke-width="1.8" fill="none" stroke-linecap="round" />
  <path d="M 336,351 Q 320,348 308,352" stroke="#007336" stroke-width="1.5" fill="none" stroke-linecap="round" />

  <!-- Rehal Stand (Alas Baca Al-Qur'an / X-Base) -->
  <path d="M 270,356 L 285,372 L 265,382" fill="none" stroke="#007336" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 330,356 L 315,372 L 335,382" fill="none" stroke="#007336" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="300" cy="372" r="3" fill="#007336" />

  <!-- Arched Ribbon / Base below the Quran and Rehal -->
  <path d="M 248,370 C 275,383 325,383 352,370 C 356,375 352,382 344,385 C 316,396 284,396 256,385 C 248,382 244,375 248,370 Z" fill="#ffffff" stroke="#007336" stroke-width="2.5" />
</svg>
